<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽天・テック12 基準価額 試算ツール</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --up: #ef4444;
      --down: #3b82f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 16px;
      text-align: center;
      color: var(--accent);
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin: 16px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      text-align: right;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .stock-row {
      display: grid;
      grid-template-columns: 1.8fr 1fr 1fr;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .stock-name {
      font-size: 0.85rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stock-weight {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
    .result-card {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .result-val {
      font-size: 1.1rem;
      font-weight: bold;
      font-family: monospace;
    }
    .highlight {
      font-size: 1.4rem;
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>楽天・テック12 試算シミュレーター</h1>

  <div class="section-title">1. 為替レート（TTM 仲値）</div>
  <div class="grid">
    <div class="form-group">
      <label>前日 仲値 (円)</label>
      <input type="number" id="prev-fx" step="0.01" value="143.50" oninput="calculate()">
    </div>
    <div class="form-group">
      <label>当日 仲値 (円)</label>
      <input type="number" id="curr-fx" step="0.01" value="144.20" oninput="calculate()">
    </div>
  </div>

  <div class="section-title">2. 元本・信託報酬</div>
  <div class="grid">
    <div class="form-group">
      <label>前日基準価額 / 保有額 (円)</label>
      <input type="number" id="base-val" step="1" value="100000" oninput="calculate()">
    </div>
    <div class="form-group">
      <label>年信託報酬率 (%)</label>
      <input type="number" id="expense-ratio" step="0.001" value="0.462" oninput="calculate()">
    </div>
  </div>

  <div class="section-title">3. 上位7銘柄 (各比率 12.0%) 前日比％</div>
  <div id="top-stocks"></div>

  <div class="section-title">4. 下位5銘柄 (各比率 3.2%) 前日比％</div>
  <div id="sub-stocks"></div>

  <div class="result-card">
    <div class="result-row">
      <span>株価加重平均 (ドル建て)</span>
      <span class="result-val" id="res-stocks">0.00%</span>
    </div>
    <div class="result-row">
      <span>為替変動率</span>
      <span class="result-val" id="res-fx">0.00%</span>
    </div>
    <div class="result-row">
      <span>総合予想変動率 (概算)</span>
      <span class="result-val" id="res-total">0.00%</span>
    </div>
    <hr style="border: none; border-top: 1px solid var(--border); margin: 10px 0;">
    <div class="result-row">
      <span>今夜の予想評価額</span>
      <span class="result-val highlight" id="res-eval">100,000 円</span>
    </div>
    <div class="result-row" style="margin-bottom:0;">
      <span>予想損益</span>
      <span class="result-val" id="res-diff">±0 円</span>
    </div>
  </div>
</div>

<script>
  // 上位7銘柄（12%）
  const topStocks = [
    { ticker: "AAPL", name: "アップル" },
    { ticker: "MSFT", name: "マイクロソフト" },
    { ticker: "NVDA", name: "エヌビディア" },
    { ticker: "GOOGL", name: "アルファベット" },
    { ticker: "AMZN", name: "アマゾン" },
    { ticker: "META", name: "メタ" },
    { ticker: "TSLA", name: "テスラ" }
  ];

  // 下位5銘柄（3.2%）
  const subStocks = [
    { ticker: "AVGO", name: "ブロードコム" },
    { ticker: "AMD", name: "AMD" },
    { ticker: "PLTR", name: "パランティア" },
    { ticker: "ORCL", name: "オラクル" },
    { ticker: "IBM", name: "IBM" }
  ];

  function renderStockInputs() {
    const topContainer = document.getElementById("top-stocks");
    topStocks.forEach((s, idx) => {
      topContainer.innerHTML += `
        <div class="stock-row">
          <div class="stock-name"><b>${s.ticker}</b> <span style="color:#64748b;">${s.name}</span></div>
          <div class="stock-weight">12.0%</div>
          <input type="number" class="stock-input top-stock-val" step="0.01" value="0.00" oninput="calculate()">
        </div>
      `;
    });

    const subContainer = document.getElementById("sub-stocks");
    subStocks.forEach((s, idx) => {
      subContainer.innerHTML += `
        <div class="stock-row">
          <div class="stock-name"><b>${s.ticker}</b> <span style="color:#64748b;">${s.name}</span></div>
          <div class="stock-weight">3.2%</div>
          <input type="number" class="stock-input sub-stock-val" step="0.01" value="0.00" oninput="calculate()">
        </div>
      `;
    });
  }

  function calculate() {
    // 1. 為替変動率
    const prevFx = parseFloat(document.getElementById("prev-fx").value) || 0;
    const currFx = parseFloat(document.getElementById("curr-fx").value) || 0;
    const fxReturn = prevFx > 0 ? (currFx - prevFx) / prevFx : 0;

    // 2. 株価リターン（ドル建て加重平均）
    let stockReturn = 0;
    document.querySelectorAll(".top-stock-val").forEach(input => {
      const val = parseFloat(input.value) || 0;
      stockReturn += (val / 100) * 0.12;
    });
    document.querySelectorAll(".sub-stock-val").forEach(input => {
      const val = parseFloat(input.value) || 0;
      stockReturn += (val / 100) * 0.032;
    });

    // 3. 信託報酬控除（日割り）
    const expenseRatio = parseFloat(document.getElementById("expense-ratio").value) || 0;
    const dailyFee = (expenseRatio / 100) / 365;

    // 4. 総合変動率
    const totalReturn = ((1 + stockReturn) * (1 + fxReturn) - 1) - dailyFee;

    // 5. 評価額計算
    const baseVal = parseFloat(document.getElementById("base-val").value) || 0;
    const estimatedVal = baseVal * (1 + totalReturn);
    const diffVal = estimatedVal - baseVal;

    // 結果表示
    formatSpan("res-stocks", stockReturn * 100, "%");
    formatSpan("res-fx", fxReturn * 100, "%");
    formatSpan("res-total", totalReturn * 100, "%");

    document.getElementById("res-eval").innerText = Math.round(estimatedVal).toLocaleString() + " 円";
    
    const diffEl = document.getElementById("res-diff");
    const diffSign = diffVal > 0 ? "+" : "";
    diffEl.innerText = diffSign + Math.round(diffVal).toLocaleString() + " 円";
    diffEl.style.color = diffVal >= 0 ? "#ef4444" : "#3b82f6";
  }

  function formatSpan(id, val, suffix) {
    const el = document.getElementById(id);
    const sign = val > 0 ? "+" : "";
    el.innerText = sign + val.toFixed(2) + suffix;
    el.style.color = val >= 0 ? "#ef4444" : "#3b82f6";
  }

  window.onload = () => {
    renderStockInputs();
    calculate();
  };
</script>
</body>
</html>
